<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Auteurs - BookNest</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f4;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: auto;
        }
        .page-header {
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ccc;
        }
        .navbar {
            margin-bottom: 30px;
        }
        .navbar-nav .nav-link {
            margin-right: 15px;
        }
        .navbar-search {
            display: flex;
            align-items: center;
        }
        .form-control, .btn-outline-secondary {
            border-radius: 20px;
        }
        .btn-danger {
            background-color: #e74c3c;
            border: none;
        }
        .btn-danger:hover {
            background-color: #c0392b;
        }
        .list-group-item {
            border-radius: .25rem;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }
        .list-group-item:hover {
            background-color: #f8f9fa;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .book-actions {
            white-space: nowrap;
        }
        .btn-primary {
            background-color: #3498db;
            border: none;
        }
        .btn-primary:hover {
            background-color: #2980b9;
        }
        .btn-success {
            background-color: #2ecc71;
            border: none;
        }
        .btn-success:hover {
            background-color: #27ae60;
        }
        .form-group label {
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- Menu de Navigation -->
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-3">
    <a class="navbar-brand" th:href="@{/pages/accueil}">
        <img src="/images/logo.png" alt="Logo" style="height: 40px; width: auto;">
        BookNest</a>
    <ul class="navbar-nav mr-auto">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/pages/accueil}">Accueil</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/pages/livres}">Livres</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/pages/auteurs}">Auteurs</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/pages/emprunts}">Emprunts</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/pages/profile}">Profil Utilisateur</a>
        </li>
    </ul>
    <div class="navbar-search">
        <!-- Barre de recherche -->
        <form class="form-inline" method="get" th:action="@{/pages/auteurs}">
            <input aria-label="Filtrer" class="form-control mr-2" name="authorFilter" placeholder="Filtrer les auteurs par nom..."
                   th:value="${param.authorFilter}" type="text">
            <button class="btn btn-outline-secondary" type="submit">Filtrer</button>
        </form>
        <div class="navbar-search">
            <form action="#" th:action="@{/logout}" method="post" style="display: inline;">
                <button class="btn btn-danger" type="submit">Déconnexion</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1 class="text-center">Auteurs - BookNest</h1>
    </div>

    <!-- Formulaire de filtre des auteurs -->
    <form th:action="@{/pages/auteurs}" method="get" class="form-inline mb-4">
        <input type="text" name="authorFilter" class="form-control mr-2" placeholder="Filtrer les auteurs par nom..."
               aria-label="Filtrer" th:value="${param.authorFilter}">
        <button class="btn btn-outline-secondary" type="submit">Filtrer</button>
    </form>

    <!-- Section Auteurs -->
    <div th:if="${auteurs}">
        <div class="row">
            <div class="col">
                <div class="list-group">
                    <!-- Affichage dynamique des auteurs -->
                    <div th:each="auteur : ${auteurs}" class="list-group-item list-group-item-action">
                        <div class="d-flex w-100 justify-content-between">
                            <h5 class="mb-1" th:text="${auteur.nom}">Nom de l'Auteur</h5>
                            <small class="text-muted" th:text="${auteur.biographie}">Biographie</small>
                        </div>
                        <div class="book-actions mt-2">
                            <div th:if="${isAdmin}">
                                <a th:href="@{/pages/editAuteur/{id}(id=${auteur.id})}" class="btn btn-primary btn-sm">Modifier</a>
                                <a th:href="@{/pages/deleteAuthor/{id}(id=${auteur.id})}" class="btn btn-danger btn-sm" onclick="confirmDelete(event)">Supprimer</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bouton Ajouter un Auteur (réservé aux administrateurs) -->
    <div th:if="${isAdmin}">
        <h2 class="mt-4">Ajouter un Auteur</h2>
        <form action="#" th:action="@{/pages/createAuthor}" method="post" th:object="${newAuteur}">
            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" class="form-control" id="nom" th:field="*{nom}" required>
            </div>
            <div class="form-group">
                <label for="biographie">Biographie</label>
                <textarea class="form-control" id="biographie" th:field="*{biographie}" required></textarea>
            </div>
            <!-- Autres champs à ajouter selon vos besoins -->
            <button type="submit" class="btn btn-success">Ajouter</button>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script>
    function confirmDelete(event) {
        if (!confirm("Are you sure you want to delete this author?")) {
            event.preventDefault();
        }
    }
</script>
</body>
</html>
