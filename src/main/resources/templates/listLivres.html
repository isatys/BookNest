<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livres - BookNest</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        .page-header {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }
        .logout-btn {
            margin-top: 10px;
        }
        .menu-item {
            margin-right: 10px;
        }
        .book-details {
            font-size: 0.9rem;
        }
        .book-actions {
            white-space: nowrap;
        }
                .navbar-nav {
            margin-right: auto;
        }
        .navbar-search {
            display: flex;
            align-items: center;
        }

    </style>
</head>
<body>

    <!-- Menu de Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-3">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item">
                <a class="nav-link menu-item" th:href="@{/pages/accueil}">Accueil</a>
            </li>
            <li class="nav-item">
                <a class="nav-link menu-item" th:href="@{/pages/livres}">Livres</a>
            </li>
            <li class="nav-item">
                <a class="nav-link menu-item" th:href="@{/pages/auteurs}">Auteurs</a>
            </li>
            <li class="nav-item">
                <a class="nav-link menu-item" th:href="@{/pages/emprunts}">Emprunts</a>
            </li>
            <li class="nav-item">
                <a class="nav-link menu-item" th:href="@{/pages/profile}">Profil Utilisateur</a>
            </li>
        </ul>
        <div class="navbar-search my-2 my-lg-0 d-flex">
            <!-- Barre de recherche -->
            <form th:action="@{/pages/livres}" method="get" class="form-inline">
                <input type="text" name="search" class="form-control mr-2" placeholder="Rechercher des livres..." aria-label="Rechercher"
                       aria-describedby="basic-addon2" th:value="${param.search}">
                <button class="btn btn-outline-secondary" type="submit"><i class="fas fa-search"></i></button>
            </form>
            <a th:href="@{/logout}" class="btn btn-danger logout-btn">Déconnexion</a>
        </div>
    </nav>
    <div class="container">
        <div class="page-header">
            <h1 class="text-center">Livres - BookNest</h1>
        </div>

        <!-- Formulaire de tri et de filtre -->
        <form th:action="@{/pages/livres}" method="get" class="form-inline mb-3">
            <label for="genreFilter" class="mr-2">Filtrer par Genre :</label>
            <select id="genreFilter" name="genre" class="form-control mr-2">
                <option value="">Tous les genres</option>
                <option th:each="genre : ${genres}" th:value="${genre}" th:text="${genre}"></option>
            </select>

            <button type="submit" class="btn btn-primary">Appliquer</button>
            <a th:href="@{/pages/livres}" class="btn btn-secondary ml-2">Réinitialiser</a>
        </form>

        <!-- Contenu dynamique -->
    <div class="text-center">
        <!-- Vérification de la présence de livres -->
        <div th:if="${livres.size() > 0}">
            <div class="row">
                <div class="col">
                    <div class="list-group">
                        <!-- Affichage dynamique des livres -->
                        <div th:each="livre : ${livres}" class="list-group-item list-group-item-action">
                            <div class="d-flex w-100 justify-content-between">
                                <h5 class="mb-1" th:text="${livre.titre}">Titre du Livre</h5>
                                <small class="text-muted" th:text="${livre.nomAuteur}">Auteur</small>
                            </div>
                            <p class="mb-1" th:text="${livre.genre}">Genre</p>
                            <div class="book-actions">
                                <div class="book-actions" th:if="${isAdmin}">
                                    <a th:href="@{/pages/editBook/{id}(id=${livre.id})}" class="btn btn-primary btn-sm">Modifier</a>
                                    <a th:href="@{/pages/deleteBook/{id}(id=${livre.id})}" class="btn btn-danger btn-sm"
                                       onclick="confirmDelete(event)">Supprimer</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Message si aucun livre n'est trouvé -->
        <div th:if="${livres.size() == 0}">
            <p>Aucun livre trouvé pour la recherche : <span th:text="${param.search}"></span></p>
        </div>
    </div>

    <!-- Bouton Ajouter un Livre (réservé aux administrateurs) -->
    <div th:if="${isAdmin}">
        <h2>Ajouter un Livre</h2>
        <form action="/pages/createLivre" method="post" th:object="${newLivre}" class="mt-3">
            <div class="form-group">
                <label for="titre">Titre</label>
                <input type="text" class="form-control" id="titre" th:field="*{titre}" required>
            </div>
            <div class="form-group">
                <label for="genre">Genre</label>
                <input type="text" class="form-control" id="genre" th:field="*{genre}" required>
            </div>
            <div class="form-group">
                <label for="nomAuteur">Nom de l'auteur</label>
                <select class="form-control" id="nomAuteur" th:field="*{nomAuteur}" required>
                    <option value="" disabled selected>Choisir un auteur</option>
                    <option th:each="auteur : ${auteurs}"
                            th:value="${auteur.nom}"
                            th:text="${auteur.nom}">
                    </option>
                    <p th:if="${#lists.isEmpty(auteurs)}">Aucun auteur disponible</p> <!-- Vérifiez si la liste est vide -->

                </select>
            </div>
            <!-- Autres champs à ajouter selon vos besoins -->
            <button type="submit" class="btn btn-success">Ajouter</button>
        </form>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script>
function confirmDelete(event) {
    if (!confirm("Are you sure you want to delete this book?")) {
        event.preventDefault();
    }
}

</script>
</body>
</html>
