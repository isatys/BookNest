<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livres - BookNest</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f4;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: auto;
        }
        .page-header {
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ccc;
        }
        .navbar {
            margin-bottom: 20px;
        }
        .navbar-nav .nav-link {
            margin-right: 15px;
        }
        .navbar-search {
            display: flex;
            align-items: center;
        }
        .form-control {
            border-radius: 20px;
        }
        .btn-outline-secondary {
            border-radius: 20px;
        }
        .page-link {
            border: 1px solid #ddd;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            background-color: #fff;
            transition: background-color 0.3s, color 0.3s;
        }
        .page-link:hover {
            color: #fff;
            background-color: #333;
        }
        .pagination-icon {
            font-size: 16px;
        }
        .pagination-ellipsis {
            background: none;
            color: #888;
            font-size: 14px;
        }
        .page-item.active .page-link {
            background-color: #333;
            color: #fff;
            border: 1px solid #333;
        }
        .list-group-item {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 15px;
            transition: box-shadow 0.3s;
        }
        .list-group-item:hover {
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .book-actions a {
            margin-right: 10px;
        }
        .btn-danger {
            background-color: #e74c3c;
            border: none;
        }
        .btn-danger:hover {
            background-color: #c0392b;
        }
        .btn-primary {
            background-color: #3498db;
            border: none;
        }
        .btn-primary:hover {
            background-color: #2980b9;
        }
        .btn-success {
            background-color: #2ecc71;
            border: none;
        }
        .btn-success:hover {
            background-color: #27ae60;
        }
        .logout-btn {
            margin-top: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-control, .form-control:focus {
            border-radius: 5px;
        }
    </style>
</head>
<body>

<!-- Menu de Navigation -->
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-3">
    <a class="navbar-brand" th:href="@{/pages/accueil}">
        <img src="/images/logo.png" alt="Logo" style="height: 40px; width: auto;">
        BookNest</a>
    <ul class="navbar-nav mr-auto">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/pages/accueil}">Accueil</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/pages/livres}">Livres</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/pages/auteurs}">Auteurs</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/pages/emprunts}">Emprunts</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/pages/profile}">Profil Utilisateur</a>
        </li>
    </ul>
    <div class="navbar-search">
        <!-- Barre de recherche -->
        <form class="form-inline" method="get" th:action="@{/pages/livres}">
            <input aria-describedby="basic-addon2" aria-label="Rechercher" class="form-control mr-2" name="search"
                   placeholder="Rechercher des livres..."
                   th:value="${param.search}" type="text">
            <button class="btn btn-outline-secondary" type="submit"><i class="fas fa-search"></i></button>
        </form>
        <div class="navbar-search">
            <form action="#" th:action="@{/logout}" method="post" style="display: inline;">
                <button class="btn btn-danger" type="submit">Déconnexion</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1 class="text-center">Livres - BookNest</h1>
    </div>

    <!-- Formulaire de tri et de filtre -->
    <form class="form-inline mb-3" method="get" th:action="@{/pages/livres}">
        <label class="mr-2" for="genreFilter">Filtrer par Genre :</label>
        <select class="form-control mr-2" id="genreFilter" name="genre">
            <option value="">Tous les genres</option>
            <option th:each="genre : ${genres}" th:text="${genre}" th:value="${genre}"></option>
        </select>

        <button class="btn btn-primary" type="submit">Appliquer</button>
        <a class="btn btn-secondary ml-2" th:href="@{/pages/livres}">Réinitialiser</a>
    </form>

    <!-- Contenu dynamique -->
    <div class="text-center">
        <!-- Vérification de la présence de livres -->
        <div th:if="${livresPage.content.size() > 0}">
            <div class="row">
                <div class="col">
                    <div class="list-group">
                        <!-- Affichage dynamique des livres -->
                        <div class="list-group-item list-group-item-action" th:each="livre : ${livresPage.content}">
                            <div class="d-flex w-100 justify-content-between">
                                <h5 class="mb-1" th:text="${livre.titre}">Titre du Livre</h5>
                                <small class="text-muted" th:text="${livre.nomAuteur}">Auteur</small>
                            </div>
                            <p class="mb-1" th:text="${livre.genre}">Genre</p>
                            <div class="book-actions">
                                <div class="book-actions" th:if="${isAdmin}">
                                    <a class="btn btn-primary btn-sm" th:href="@{/pages/editBook/{id}(id=${livre.id})}">Modifier</a>
                                    <a class="btn btn-danger btn-sm" onclick="confirmDelete(event)"
                                       th:href="@{/pages/deleteBook/{id}(id=${livre.id})}">Supprimer</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <nav>
                <ul class="pagination justify-content-center">
                    <!-- Premier bouton -->
                    <li class="page-item" th:if="${livresPage.hasPrevious()}">
                        <a aria-label="First"
                           class="page-link"
                           th:href="@{/pages/livres(page=0, size=${livresPage.size}, search=${search}, genre=${genre})}">
                            <span aria-hidden="true" class="pagination-icon">««</span>
                        </a>
                    </li>

                    <!-- Bouton Précédent -->
                    <li class="page-item" th:if="${livresPage.hasPrevious()}">
                        <a aria-label="Previous"
                           class="page-link"
                           th:href="@{/pages/livres(page=${livresPage.number - 1}, size=${livresPage.size}, search=${search}, genre=${genre})}">
                            <span aria-hidden="true" class="pagination-icon">«</span>
                        </a>
                    </li>

                    <!-- Affichage des pages avec ellipses -->
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, livresPage.totalPages - 1)}"
                        th:if="${livresPage.totalPages > 5 && (i < 2 || i > livresPage.totalPages - 3 || (i >= livresPage.number - 1 && i <= livresPage.number + 1))}">
                        <a class="page-link"
                           th:href="@{/pages/livres(page=${i}, size=${livresPage.size}, search=${search}, genre=${genre})}"
                           th:text="${i + 1}"></a>
                    </li>

                    <!-- Ellipses -->
                    <li class="page-item disabled"
                        th:if="${livresPage.totalPages > 5 && livresPage.number > 2 && livresPage.number < livresPage.totalPages - 3}">
                        <span class="page-link pagination-ellipsis">...</span>
                    </li>

                    <!-- Bouton Suivant -->
                    <li class="page-item" th:if="${livresPage.hasNext()}">
                        <a aria-label="Next"
                           class="page-link"
                           th:href="@{/pages/livres(page=${livresPage.number + 1}, size=${livresPage.size}, search=${search}, genre=${genre})}">
                            <span aria-hidden="true" class="pagination-icon">»</span>
                        </a>
                    </li>

                    <!-- Dernier bouton -->
                    <li class="page-item" th:if="${livresPage.hasNext()}">
                        <a aria-label="Last"
                           class="page-link"
                           th:href="@{/pages/livres(page=${livresPage.totalPages - 1}, size=${livresPage.size}, search=${search}, genre=${genre})}">
                            <span aria-hidden="true" class="pagination-icon">»»</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Message si aucun livre n'est trouvé -->
        <div th:if="${livresPage.content.size() == 0}">
            <p>Aucun livre trouvé pour la recherche : <span th:text="${search}"></span></p>
        </div>
    </div>

    <!-- Bouton Ajouter un Livre (réservé aux administrateurs) -->
    <div th:if="${isAdmin}">
        <h2 class="mt-4">Ajouter un Livre</h2>
        <form action="#" th:action="@{/pages/createLivre}" method="post" th:object="${newLivre}">
        <div class="form-group">
                <label for="titre">Titre</label>
                <input class="form-control" id="titre" required th:field="*{titre}" type="text">
            </div>
            <div class="form-group">
                <label for="genre">Genre</label>
                <select class="form-control" id="genre" required th:field="*{genre}">
                    <option disabled selected value="">Choisir un genre</option>
                    <option th:each="genre : ${genres}"
                            th:text="${genre}"
                            th:value="${genre}">
                    </option>
                </select>

            </div>
            <div class="form-group">
                <label for="nomAuteur">Nom de l'auteur</label>
                <select class="form-control" id="nomAuteur" required th:field="*{nomAuteur}">
                    <option disabled selected value="">Choisir un auteur</option>
                    <option th:each="auteur : ${auteurs}"
                            th:text="${auteur.nom}"
                            th:value="${auteur.nom}">
                    </option>
                    <p th:if="${#lists.isEmpty(auteurs)}">Aucun auteur disponible</p>
                </select>
            </div>
            <button class="btn btn-success" type="submit">Ajouter</button>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script>
    function confirmDelete(event) {
        if (!confirm("Êtes-vous sûr de vouloir supprimer ce livre ?")) {
            event.preventDefault();
        }
    }
</script>
</body>
</html>
