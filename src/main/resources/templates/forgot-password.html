<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mot de Passe Oublié</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .forgot-password-container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
<div class="forgot-password-container">
    <h1 class="text-center">Réinitialisation du Mot de Passe</h1>
    <form th:action="@{/forgot-password}" method="post">
        <div class="form-group">
            <label for="email">Entrez votre adresse email :</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Envoyer le Lien de Réinitialisation</button>
    </form>
    <p th:if="${message}" class="text-success" th:text="${message}"></p>
    <p th:if="${error}" class="text-danger" th:text="${error}"></p>
</div>
</body>
</html>
