<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Éditer Emprunt - BookNest</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        .page-header {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>
<!-- Menu de Navigation -->
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-3">
    <a class="navbar-brand" th:href="@{/}">BookNest</a>
    <ul class="navbar-nav mr-auto">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/pages/accueil}">Accueil</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/pages/livres}">Livres</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/pages/auteurs}">Auteurs</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/pages/emprunts}">Emprunts</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/pages/profile}">Profil Utilisateur</a>
        </li>
    </ul>
    <div class="navbar-search my-2 my-lg-0 d-flex">
        <!-- Barre de recherche -->
        <form th:action="@{/pages/livres}" method="get" class="form-inline">
            <input type="text" name="search" class="form-control mr-2" placeholder="Rechercher des livres..." aria-label="Rechercher"
                   aria-describedby="basic-addon2" th:value="${param.search}">
            <button class="btn btn-outline-secondary" type="submit"><i class="fas fa-search"></i></button>
        </form>
        <div class="navbar-search">
            <form action="#" th:action="@{/logout}" method="post" style="display: inline;">
                <button class="btn btn-danger" type="submit">Déconnexion</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1 th:text="${emprunt != null && emprunt.id != null ? 'Modifier Emprunt' : 'Ajouter un Emprunt'}">Éditer Emprunt</h1>
    </div>

    <!-- Affichage des messages d'information ou d'erreur -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
    </div>
    <div th:if="${infoMessage}" class="alert alert-info">
        <p th:text="${infoMessage}"></p>
    </div>


    <!-- Formulaire d'édition de l'emprunt -->
    <form th:action="@{/pages/updateEmprunt}" th:object="${emprunt}" method="post" class="mt-3">
        <!-- Champs du formulaire -->
        <input type="hidden" th:field="*{id}"/>
        <div class="form-group">
            <label for="dateEmprunt">Date d'Emprunt</label>
            <input type="date" class="form-control" id="dateEmprunt" th:field="*{dateEmprunt}" required>
        </div>
        <div class="form-group">
            <label for="dateRetour">Date de Retour</label>
            <input type="date" class="form-control" id="dateRetour" th:field="*{dateRetour}" required>
        </div>
        <div class="form-group">
            <label for="livre">Livre</label>
            <select id="livre" th:field="*{livre.id}" class="form-control">
                <option th:each="livre : ${livres}" th:value="${livre.id}" th:text="${livre.titre}"></option>
            </select>
        </div>
        <div class="form-group">
            <label for="utilisateur">Utilisateur</label>
            <select id="utilisateur" th:field="*{utilisateur.id}" class="form-control">
                <option th:each="utilisateur : ${utilisateurs}" th:value="${utilisateur.id}" th:text="${utilisateur.nom}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Enregistrer</button>
    </form>

</div>

<script>
    // Validation des dates
    function validateDates() {
        const dateEmprunt = document.getElementById('dateEmprunt').value;
        const dateRetour = document.getElementById('dateRetour').value;
        if (dateRetour && dateEmprunt > dateRetour) {
            alert("La date de retour ne peut pas être antérieure à la date d'emprunt.");
            return false;
        }
        return true;
    }
</script>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
