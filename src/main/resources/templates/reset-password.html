<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Réinitialiser le Mot de Passe</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .reset-container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
<div class="reset-container">
    <h1 class="text-center">Réinitialiser le Mot de Passe</h1>
    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <div class="form-group">
            <label for="password">Nouveau Mot de Passe:</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirmer le Mot de Passe:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
            <p th:if="${error}" class="text-danger" th:text="${error}"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Réinitialiser le Mot de Passe</button>
    </form>
</div>
</body>
</html>
